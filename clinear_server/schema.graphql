# Linear-compatible GraphQL SDL — the subset clinear actually uses.
# Field names are EXACT camelCase; clinear's Pydantic models alias to these.

scalar DateTime
scalar TimelessDate
scalar JSON

type Query {
  viewer: User
  teams(first: Int = 50, after: String, filter: TeamFilter): TeamConnection
  team(id: String!): Team
  issues(filter: IssueFilter, first: Int = 50, after: String, orderBy: PaginationOrderBy): IssueConnection
  issue(id: String!): Issue
  projects(filter: ProjectFilter, first: Int = 50, after: String): ProjectConnection
  project(id: String!): Project
  workflowStates(filter: WorkflowStateFilter, first: Int = 100, after: String): WorkflowStateConnection
  cycles(filter: CycleFilter, first: Int = 100, after: String): CycleConnection
  issueLabels(filter: IssueLabelFilter, first: Int = 100, after: String): IssueLabelConnection
  searchIssues(term: String!, first: Int = 20): IssueConnection
  rateLimitStatus: RateLimitPayload
}

type Mutation {
  issueCreate(input: IssueCreateInput!): IssuePayload
  issueUpdate(id: String!, input: IssueUpdateInput!): IssuePayload
  issueDelete(id: String!): DeletePayload
  issueArchive(id: String!): DeletePayload
  commentCreate(input: CommentCreateInput!): CommentPayload
  commentUpdate(id: String!, input: CommentUpdateInput!): CommentPayload
  commentDelete(id: String!): DeletePayload
  issueLabelCreate(input: IssueLabelCreateInput!): IssueLabelPayload
  issueLabelDelete(id: String!): DeletePayload
  projectCreate(input: ProjectCreateInput!): ProjectPayload
  projectUpdate(id: String!, input: ProjectUpdateInput!): ProjectPayload
  projectArchive(id: String!): DeletePayload
  attachmentCreate(input: AttachmentCreateInput!): AttachmentPayload
}

enum PaginationOrderBy { createdAt updatedAt }

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type User {
  id: ID!
  name: String
  displayName: String
  email: String
  active: Boolean
  isMe: Boolean
  admin: Boolean
  avatarUrl: String
  url: String
  timezone: String
  statusEmoji: String
  statusLabel: String
  createdAt: DateTime
  updatedAt: DateTime
}

type Team {
  id: ID!
  name: String!
  key: String!
  description: String
  color: String
  icon: String
  private: Boolean
  timezone: String
  createdAt: DateTime
  updatedAt: DateTime
  states(first: Int = 100): WorkflowStateConnection
  members(first: Int = 100): UserConnection
  cycles(first: Int = 50): CycleConnection
  activeCycle: Cycle
}

type WorkflowState {
  id: ID!
  name: String!
  color: String
  description: String
  position: Float
  type: String!
  createdAt: DateTime
  updatedAt: DateTime
  team: Team
}

type IssueLabel {
  id: ID!
  name: String!
  color: String
  description: String
  createdAt: DateTime
  updatedAt: DateTime
}

type Cycle {
  id: ID!
  name: String
  number: Int
  startsAt: DateTime
  endsAt: DateTime
  completedAt: DateTime
  progress: Float
  createdAt: DateTime
  updatedAt: DateTime
  team: Team
}

type Project {
  id: ID!
  name: String!
  description: String
  slugId: String
  icon: String
  color: String
  state: String
  progress: Float
  startDate: TimelessDate
  targetDate: TimelessDate
  url: String
  lead: User
  creator: User
  members(first: Int = 100): UserConnection
  teams(first: Int = 100): TeamConnection
  health: String
  createdAt: DateTime
  updatedAt: DateTime
}

type Comment {
  id: ID!
  body: String!
  url: String
  user: User
  createdAt: DateTime
  updatedAt: DateTime
}

type Issue {
  id: ID!
  identifier: String!
  title: String!
  description: String
  priority: Int
  priorityLabel: String
  estimate: Float
  url: String
  branchName: String
  number: Int
  createdAt: DateTime
  updatedAt: DateTime
  dueDate: DateTime
  completedAt: DateTime
  canceledAt: DateTime
  startedAt: DateTime
  snoozedUntilAt: DateTime
  state: WorkflowState
  assignee: User
  creator: User
  team: Team
  project: Project
  cycle: Cycle
  parent: Issue
  labels(first: Int = 50): IssueLabelConnection
  subscribers(first: Int = 50): UserConnection
  comments(first: Int = 50): CommentConnection
}

type UserConnection { nodes: [User!]! pageInfo: PageInfo! }
type TeamConnection { nodes: [Team!]! pageInfo: PageInfo! }
type WorkflowStateConnection { nodes: [WorkflowState!]! pageInfo: PageInfo! }
type IssueConnection { nodes: [Issue!]! pageInfo: PageInfo! }
type IssueLabelConnection { nodes: [IssueLabel!]! pageInfo: PageInfo! }
type ProjectConnection { nodes: [Project!]! pageInfo: PageInfo! }
type CycleConnection { nodes: [Cycle!]! pageInfo: PageInfo! }
type CommentConnection { nodes: [Comment!]! pageInfo: PageInfo! }

type IssuePayload { success: Boolean! issue: Issue }
type CommentPayload { success: Boolean! comment: Comment }
type IssueLabelPayload { success: Boolean! issueLabel: IssueLabel }
type ProjectPayload { success: Boolean! project: Project }
type DeletePayload { success: Boolean! }
type AttachmentPayload { success: Boolean! attachment: Attachment }
type Attachment {
  id: ID!
  url: String!
  title: String!
  subtitle: String
  issue: Issue
  createdAt: DateTime
}

type RateLimitPayload {
  identifier: String
  kind: String
  limit: Int
  remaining: Int
  requestsPerHour: Int
  resetsAt: DateTime
}

# ---- Filter inputs (comparators clinear emits) ----
input StringComparator {
  eq: String
  neq: String
  in: [String!]
  nin: [String!]
  contains: String
  containsIgnoreCase: String
  eqIgnoreCase: String
}
input IDComparator { eq: ID in: [ID!] neq: ID }
input NumberComparator { eq: Float neq: Float gt: Float lt: Float gte: Float lte: Float in: [Float!] }
input DateComparator { eq: DateTime neq: DateTime gt: DateTime lt: DateTime gte: DateTime lte: DateTime }
input BooleanComparator { eq: Boolean neq: Boolean }

input TeamFilter { key: StringComparator id: IDComparator name: StringComparator }
input UserFilter { id: IDComparator email: StringComparator displayName: StringComparator name: StringComparator }
input WorkflowStateFilter { name: StringComparator type: StringComparator team: TeamFilter }
input CycleFilter { id: IDComparator name: StringComparator team: TeamFilter isActive: BooleanComparator isNext: BooleanComparator }
input ProjectRelFilter { id: IDComparator name: StringComparator }
input LabelRelFilter { name: StringComparator }

input IssueFilter {
  identifier: StringComparator
  team: TeamFilter
  state: WorkflowStateFilter
  assignee: UserFilter
  creator: UserFilter
  project: ProjectRelFilter
  cycle: CycleFilter
  labels: LabelRelFilter
  priority: NumberComparator
  number: NumberComparator
  title: StringComparator
  description: StringComparator
  updatedAt: DateComparator
  createdAt: DateComparator
  dueDate: DateComparator
  and: [IssueFilter!]
  or: [IssueFilter!]
}

input ProjectFilter { slugId: StringComparator name: StringComparator state: StringComparator }
input IssueLabelFilter { team: TeamFilter name: StringComparator }

# ---- Mutation inputs ----
input IssueCreateInput {
  title: String!
  teamId: String!
  description: String
  priority: Int
  stateId: String
  assigneeId: String
  projectId: String
  cycleId: String
  parentId: String
  estimate: Float
  dueDate: DateTime
  labelIds: [String!]
}
input IssueUpdateInput {
  title: String
  description: String
  priority: Int
  stateId: String
  assigneeId: String
  projectId: String
  cycleId: String
  parentId: String
  estimate: Float
  dueDate: DateTime
  labelIds: [String!]
}
input CommentCreateInput { issueId: String! body: String! }
input CommentUpdateInput { body: String }
input IssueLabelCreateInput { name: String! teamId: String color: String description: String }
input ProjectCreateInput { name: String! description: String teamIds: [String!] leadId: String state: String color: String icon: String startDate: TimelessDate targetDate: TimelessDate }
input ProjectUpdateInput { name: String description: String leadId: String state: String color: String icon: String startDate: TimelessDate targetDate: TimelessDate }
input AttachmentCreateInput { issueId: String! url: String! title: String! subtitle: String }
